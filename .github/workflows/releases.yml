name: Releases

on:
  push:
    tags:
      - 'v*.*'  # Only run on version tags

jobs:
  set_versions:
    runs-on: ubuntu-latest
    outputs:
      ff_version: ${{ steps.get_version.outputs.ff_version }}
      ubuntu_versions: ${{ steps.set_os_versions.outputs.ubuntu_versions }}
      windows_versions: ${{ steps.set_os_versions.outputs.windows_versions }}
      docker_arch: ${{ steps.set_os_versions.outputs.docker_arch }}
      is_master: ${{ steps.check_branch.outputs.is_master }}

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from configure.ac
        id: get_version
        run: |
          VERSION=$(grep AC_INIT configure.ac | cut -d"," -f2 | cut -d"[" -f2 | cut -d"]" -f1)
          echo "ff_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted FreeFEM version: $VERSION"

      - name: Set OS versions
        id: set_os_versions
        run: |
          echo "ubuntu_versions=[22.04, 24.04, 26.04]" >> $GITHUB_OUTPUT
          echo "windows_versions=[2025]" >> $GITHUB_OUTPUT
          echo 'docker_arch=["amd64", "arm64"]' >> $GITHUB_OUTPUT

      - name: Check if tag is on master
        id: check_branch
        run: |
          git fetch origin master
          if git branch -a --contains ${{ github.sha }} | grep -q 'origin/master'; then
            echo "is_master=true" >> $GITHUB_OUTPUT
            echo "Tag is on master branch - will create a release"
          else
            echo "is_master=false" >> $GITHUB_OUTPUT
            echo "Tag is NOT on master - will create a pre-release"
          fi

  get_deb_packages:
    needs: set_versions
    uses: ./.github/workflows/release_deb.yml
    with:
      release_version: ${{ needs.set_versions.outputs.ff_version }}
      ubuntu_versions: ${{ needs.set_versions.outputs.ubuntu_versions }}

  get_exe_packages:
    needs: set_versions
    uses: ./.github/workflows/full-msmpi.yml
    with:
      release_version: ${{ needs.set_versions.outputs.ff_version }}
      windows_versions: ${{ needs.set_versions.outputs.windows_versions }}
      build_types: '["release"]'
      skip_check: true
      upload_build_artifacts: true

  get_docker_images:
    needs: set_versions
    uses: ./.github/workflows/docker.yml
    with:
      release_version: ${{ needs.set_versions.outputs.ff_version }}
      docker_arch: ${{ needs.set_versions.outputs.docker_arch }}
      publish_latest: ${{ needs.set_versions.outputs.is_master == 'true' }}
    secrets: inherit

  create_release:
    needs: [set_versions, get_deb_packages, get_exe_packages, get_docker_images]
    outputs:
      ff_version: ${{ needs.set_versions.outputs.ff_version }}
      ubuntu_versions: ${{ needs.set_versions.outputs.ubuntu_versions }}
      windows_versions: ${{ needs.set_versions.outputs.windows_versions }}
      docker_arch: ${{ needs.set_versions.outputs.docker_arch }}
      is_master: ${{ needs.set_versions.outputs.is_master }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          pattern: v${{ needs.set_versions.outputs.ff_version }}*
          merge-multiple: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/*.deb
            ./release-assets/*.exe
            ./release-assets/*-docker-linux-*.tar.gz
          draft: false
          prerelease: ${{ needs.set_versions.outputs.is_master == 'false' }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check_release:
    needs: create_release
    uses: ./.github/workflows/release_check.yml
    with:
      release_version: ${{ github.ref_name }}
      windows_versions: ${{ needs.create_release.outputs.windows_versions }}
      ubuntu_versions: ${{ needs.create_release.outputs.ubuntu_versions }}

  publish_docker_image:
    needs: [create_release, check_release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REGISTRY_IMAGE: docker.io/freefem/freefem
    steps:
      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ needs.create_release.outputs.is_master == 'true' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Create and push multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_ARCH: ${{ needs.create_release.outputs.docker_arch }}
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euxo pipefail
          shopt -s nullglob
          digest_files=(*)
          expected_digests=$(jq length <<< "${DOCKER_ARCH}")

          if (( ${#digest_files[@]} != expected_digests )); then
            echo "Expected ${expected_digests} image digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          mapfile -t tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${tag}")
          done

          digest_args=()
          for digest in "${digest_files[@]}"; do
            digest_args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Verify multi-platform image
        env:
          DOCKER_ARCH: ${{ needs.create_release.outputs.docker_arch }}
        run: |
          set -euxo pipefail
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" \
            | jq --exit-status --argjson expected "${DOCKER_ARCH}" \
                '([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | unique | sort) == ($expected | unique | sort)'
